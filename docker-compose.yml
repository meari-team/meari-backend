# 로컬 개발용 DB. `docker compose up -d` 후 .env의 DATABASE_URL/DIRECT_URL을
# postgresql://postgres:postgres@localhost:5432/meari_dev 로 설정한다.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meari_dev
    ports:
      - '5432:5432'
    volumes:
      - meari-db:/var/lib/postgresql/data

volumes:
  meari-db:
